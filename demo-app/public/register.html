<!doctype html><html><head><title>Demo Store - Register</title><style>body{font-family:sans-serif;max-width:420px;margin:40px auto}label{display:block;margin-top:10px}input{width:100%;padding:6px}button{margin-top:14px;padding:8px 16px}.error{color:#c00;margin-top:10px}.ok{color:#080;margin-top:10px}</style></head><body>
<h1>Create account</h1>
<label for="fn">First name</label><input id="fn">
<label for="ln">Last name</label><input id="ln">
<label for="em">Email</label><input id="em">
<label for="ph">Phone</label><input id="ph">
<button id="create">Create account</button>
<div id="msg"></div>
<script>
document.getElementById('create').onclick = () => {
  const v = id => document.getElementById(id).value.trim();
  const msg = document.getElementById('msg');
  const ok = v('fn') && v('ln') && /^\S+@\S+\.\S+$/.test(v('em')) && /^[6-9]\d{9}$/.test(v('ph'));
  msg.className = ok ? 'ok' : 'error';
  msg.textContent = ok ? 'Account created' : 'Please fix the highlighted fields';
};
</script></body></html>
